name: Recent activity

on:
  schedule:
    - cron: "30 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Render recently updated public repos
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          gh api "users/$OWNER/repos?sort=pushed&per_page=20&type=owner" > repos.json
          python3 - <<'PY'
          import json, re, datetime
          repos = [r for r in json.load(open("repos.json"))
                   if not r["fork"] and r["name"] != r["owner"]["login"]][:5]
          today = datetime.datetime.now(datetime.timezone.utc)
          def ago(ts):
              d = (today - datetime.datetime.fromisoformat(ts.replace("Z", "+00:00"))).days
              return "today" if d == 0 else f"{d} day{'s' if d > 1 else ''} ago"
          lines = [f"- 🔨 Pushed to [**{r['name']}**]({r['html_url']})"
                   f"{' · ' + r['language'] if r['language'] else ''} · {ago(r['pushed_at'])}"
                   for r in repos]
          s = open("README.md").read()
          s = re.sub(r"(<!--START_SECTION:activity-->\n).*?(<!--END_SECTION:activity-->)",
                     lambda m: m.group(1) + "\n".join(lines) + "\n" + m.group(2), s, flags=re.S)
          open("README.md", "w").write(s)
          PY
          rm repos.json
      - name: Commit if changed
        run: |
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: refresh recent activity"
          git push
