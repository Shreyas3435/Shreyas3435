<svg xmlns="http://www.w3.org/2000/svg" width="860" height="300" viewBox="0 0 860 300" role="img" aria-label="Terminal: whoami — Shreyas Alva, full stack and AI engineer">
  <style>
    .win{fill:#0d1117;stroke:#30363d}
