<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="140" viewBox="0 0 1200 140" role="img" aria-label="Building. Learning. Improving. Repeat.">
<defs><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#1b2128"/></pattern><clipPath id="c"><rect width="1200" height="140" rx="16"/></clipPath></defs>
<style>
  .pulse{stroke:#34d399;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-dasharray:5 95;animation:flow linear infinite}
  @keyframes flow{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
  .trace{stroke:#1f3a33;stroke-width:2;fill:none;stroke-linejoin:round}
  .via{fill:#07090c;stroke:#2b4a42;stroke-width:2}
  .fade{opacity:0;animation:fade .7s ease forwards}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .ping{animation:ping 2s ease-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes ping{from{transform:scale(1);opacity:.7}to{transform:scale(3);opacity:0}}
  .caret{animation:blink 1s step-end infinite}
  @keyframes blink{50%{opacity:0}}

  .w{fill:#484f58;animation:w 3.2s ease-in-out infinite}
  @keyframes w{0%,100%{fill:#484f58}15%,35%{fill:#e6edf3}}
</style>
<g clip-path="url(#c)">
  <rect width="1200" height="140" fill="#07090c"/><rect width="1200" height="140" fill="url(#dots)"/>
  <path class="trace" d="M0 30 L140 30 L170 60 L260 60"/>
<path class="trace" d="M0 110 L110 110 L140 80 L230 80"/>
<path class="trace" d="M1200 30 L1060 30 L1030 60 L940 60"/>
<path class="trace" d="M1200 110 L1090 110 L1060 80 L970 80"/>
<path class="pulse" pathLength="100" d="M0 30 L140 30 L170 60 L260 60" style="animation-duration:2.60s;animation-delay:-0.00s"/>
<path class="pulse" pathLength="100" d="M0 110 L110 110 L140 80 L230 80" style="animation-duration:2.97s;animation-delay:-0.71s"/>
<path class="pulse" pathLength="100" d="M1200 30 L1060 30 L1030 60 L940 60" style="animation-duration:3.34s;animation-delay:-1.42s"/>
<path class="pulse" pathLength="100" d="M1200 110 L1090 110 L1060 80 L970 80" style="animation-duration:3.71s;animation-delay:-2.13s"/>
<circle class="via" cx="260" cy="60" r="4.5"/>
<circle class="via" cx="230" cy="80" r="4.5"/>
<circle class="via" cx="940" cy="60" r="4.5"/>
<circle class="via" cx="970" cy="80" r="4.5"/>
  <text x="600" y="70" text-anchor="middle" font-family="'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif" font-size="28" font-weight="800" letter-spacing=".5"><tspan class="w" style="animation-delay:0.0s">Building. </tspan><tspan class="w" style="animation-delay:0.8s">Learning. </tspan><tspan class="w" style="animation-delay:1.6s">Improving. </tspan><tspan class="w" style="animation-delay:2.4s">Repeat. </tspan></text>
  <text x="600" y="100" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="12.5" fill="#7d8590"><tspan fill="#34d399">●</tspan> thanks for stopping by — star something you like</text>
  <rect x=".5" y=".5" width="1199" height="139" rx="16" fill="none" stroke="#21262d"/>
</g>
</svg>