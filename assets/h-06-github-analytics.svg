<svg xmlns="http://www.w3.org/2000/svg" width="900" height="72" viewBox="0 0 900 72" role="img" aria-label="GitHub analytics">
<defs><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#1b2128"/></pattern></defs>
<style>
  .pulse{stroke:#34d399;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-dasharray:5 95;animation:flow linear infinite}
  @keyframes flow{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
  .trace{stroke:#1f3a33;stroke-width:2;fill:none;stroke-linejoin:round}
  .via{fill:#07090c;stroke:#2b4a42;stroke-width:2}
  .fade{opacity:0;animation:fade .7s ease forwards}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .ping{animation:ping 2s ease-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes ping{from{transform:scale(1);opacity:.7}to{transform:scale(3);opacity:0}}
  .caret{animation:blink 1s step-end infinite}
  @keyframes blink{50%{opacity:0}}

  .draw{stroke-dasharray:1000;stroke-dashoffset:1000;animation:d 1.6s .3s cubic-bezier(.3,0,.2,1) forwards}
  @keyframes d{to{stroke-dashoffset:0}}
</style>
<rect x=".5" y=".5" width="899" height="71" rx="12" fill="#07090c" stroke="#21262d"/>
<rect x=".5" y=".5" width="899" height="71" rx="12" fill="url(#dots)"/>
<g class="fade">
  <rect x="18" y="20" width="44" height="32" rx="6" fill="#0d1117" stroke="#2b4a42"/>
  <text x="40" y="41" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="14" font-weight="700" fill="#34d399">06</text>
  <text x="80" y="38" font-family="'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="800" fill="#e6edf3">GitHub analytics<tspan class="caret" fill="#34d399" font-weight="400">▍</tspan></text>
  <text x="80" y="57" font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="12" fill="#7d8590">gh api /users/Shreyas3435</text>
</g>
<path class="trace draw" d="M344 30 L780 30 L800 50 L876 50"/>
<path class="pulse" pathLength="100" d="M344 30 L780 30 L800 50 L876 50" style="animation-duration:3.2s;animation-delay:1.9s"/>
<circle class="via" cx="344" cy="30" r="4"/><circle class="via" cx="876" cy="50" r="4"/>
</svg>