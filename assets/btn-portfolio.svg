<svg xmlns="http://www.w3.org/2000/svg" width="250" height="64" viewBox="0 0 250 64" role="img" aria-label="Portfolio">
<defs>
  <linearGradient id="b" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#e6edf3"/><stop offset=".5" stop-color="#a371f7"/><stop offset="1" stop-color="#39d0d8"/>
    <animateTransform attributeName="gradientTransform" type="rotate" values="0 .5 .5;360 .5 .5" dur="4s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="sh" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".14"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <clipPath id="c"><rect x="2" y="2" width="246" height="60" rx="14"/></clipPath>
</defs>
<style>.sh{animation:sh 3.5s ease-in-out infinite}@keyframes sh{0%{transform:translateX(-120px)}50%,100%{transform:translateX(290px)}}
.ar{animation:ar 1.6s ease-in-out infinite}@keyframes ar{50%{transform:translateX(4px)}}</style>
<rect x="2" y="2" width="246" height="60" rx="14" fill="#0b0f19"/>
<g clip-path="url(#c)"><rect class="sh" x="0" y="0" width="90" height="64" fill="url(#sh)"/></g>
<rect x="2" y="2" width="246" height="60" rx="14" fill="none" stroke="url(#b)" stroke-width="2"/>
<rect x="16" y="14" width="36" height="36" rx="10" fill="#e6edf3" fill-opacity=".14"/>
<g transform="translate(24 22) scale(.8333)"><path d="M24 22.525H0l12-21.05 12 21.05z" fill="#e6edf3"/></g>
<text x="66" y="30" font-family="'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="700" fill="#e6edf3">Portfolio</text>
<text x="66" y="47" font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="11" fill="#8b949e">portfolio.vercel.app</text>
<text class="ar" x="220" y="38" font-family="'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="700" fill="#e6edf3">→</text>
</svg>