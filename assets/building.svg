<text x="68" y="66" font-family="'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif" font-size="14" fill="#7d8590">Compilers that turn OpenAPI specs into scored MCP tool surfaces, and gateways that serve</text>
<text x="68" y="85" font-family="'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif" font-size="14" fill="#7d8590">knowledge bundles to agents with trust policies.</text>
