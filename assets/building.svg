<svg xmlns="http://www.w3.org/2000/svg" width="900" height="356" viewBox="0 0 900 356">
<defs><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#1b2128"/></pattern></defs>
<style>
  .pulse{stroke:#34d399;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-dasharray:5 95;animation:flow linear infinite}
  @keyframes flow{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
  .trace{stroke:#1f3a33;stroke-width:2;fill:none;stroke-linejoin:round}
  .via{fill:#07090c;stroke:#2b4a42;stroke-width:2}
  .fade{opacity:0;animation:fade .7s ease forwards}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .ping{animation:ping 2s ease-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes ping{from{transform:scale(1);opacity:.7}to{transform:scale(3);opacity:0}}
  .caret{animation:blink 1s step-end infinite}
  @keyframes blink{50%{opacity:0}}
</style>
<rect x=".5" y=".5" width="899" height="355" rx="14" fill="#07090c" stroke="#21262d"/>
<rect x=".5" y=".5" width="899" height="355" rx="14" fill="url(#dots)"/>
<path class="trace" d="M40 36 V287"/>
<path class="pulse" pathLength="100" d="M40 36 V287" style="animation-duration:3.5s"/>
<g class="fade" style="animation-delay:0.00s">
<rect x="31" y="27" width="18" height="18" rx="4" fill="#0d1117" stroke="#2b4a42"/><circle cx="40" cy="36" r="3.5" fill="#34d399"/>
<text x="68" y="42" font-family="'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="700" fill="#e6edf3">Agent infrastructure</text>
